name: Nova OS · APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - name: Build and verify APK
        run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-OS-1.0.0-debug
          path: artifacts/*.apk
          if-no-files-found: error
