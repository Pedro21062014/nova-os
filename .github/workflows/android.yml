name: Nova OS · APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Check legacy WebView assets
        run: |
          npm ci
          npm run build:ui
          git diff --exit-code -- app/src/main/assets/app.js app/src/main/assets/style.css
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - name: Build and verify APK
        run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-OS-debug
          path: artifacts/*.apk
          if-no-files-found: error
