name: Nova OS · Publicar atualização assinada
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - name: Validate tag and sign APK
        env:
          NOVA_KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEYSTORE_PASS: ${{ secrets.NOVA_KEYSTORE_PASS }}
          NOVA_KEY_PASS: ${{ secrets.NOVA_KEY_PASS }}
        run: |
          set -euo pipefail
          v=${GITHUB_REF_NAME#v}
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "android:versionName=\"$v\"" app/src/main/AndroidManifest.xml
          export NOVA_KEYSTORE="$RUNNER_TEMP/nova-release.jks"
          trap 'rm -f "$NOVA_KEYSTORE"' EXIT
          umask 077
          : "${NOVA_KEYSTORE_B64:?Defina o segredo NOVA_KEYSTORE_B64 no repositório}"
          printf '%s' "$NOVA_KEYSTORE_B64" | base64 --decode > "$NOVA_KEYSTORE"
          ./scripts/build-apk.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "artifacts/Nova-OS-${GITHUB_REF_NAME#v}.apk" --verify-tag --generate-notes --latest
